<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3584e4"/>
      <stop offset="1" stop-color="#1a5fb4"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="24" fill="#241f31"/>
  <!-- mouse body -->
  <rect x="42" y="24" width="44" height="80" rx="22" fill="url(#g)" stroke="#deddda" stroke-width="3"/>
  <!-- split buttons -->
  <line x1="64" y1="26" x2="64" y2="58" stroke="#deddda" stroke-width="3"/>
  <!-- scroll wheel / RGB dot -->
  <rect x="60" y="40" width="8" height="16" rx="4" fill="#2ec27e"/>
  <!-- DPI indicator strip (RGB) -->
  <circle cx="64" cy="76" r="5" fill="#e01b24"/>
  <circle cx="64" cy="90" r="3" fill="#f6d32d"/>
</svg>
